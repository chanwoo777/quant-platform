# Run the whole test suite on every push to main and on every pull request (including
# Dependabot's). The tests need no data, keys or network services: the dashboard smoke tests
# skip without a local database, and the website's JavaScript is tested under Node.js.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-quantum.txt
            requirements-lock.txt

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24"

      - name: Install dependencies
        # FinBERT (torch, transformers) is left out: the tests use the lexicon scorer, and CI
        # shouldn't download a 440 MB model on every push.
        run: |
          grep -v -E '^(torch|transformers)\b' requirements.txt > ci-requirements.txt
          python -m pip install --upgrade pip
          pip install -r ci-requirements.txt -r requirements-quantum.txt -c requirements-lock.txt

      - name: Audit Python dependencies (pip-audit)
        # Known vulnerabilities (PyPI advisory database / OSV) in everything installed above. The website has no
        # npm dependencies: its two browser libraries are pinned jsDelivr URLs with Subresource Integrity.
        run: |
          pip install pip-audit==2.9.0
          pip-audit --progress-spinner off

      - name: Calculation tests, with coverage
        # Every financial calculation against hand-checked values (tests/test_calculations.py) and
        # numpy/scipy references. The same files gate quant/web/publish.py, so the site can't be
        # published with a failing calculation. Coverage floors: the browser's maths (quant.js) and the
        # nightly job's calculation modules.
        env:
          NODE_V8_COVERAGE: ${{ runner.temp }}/v8cov
        run: |
          pip install coverage==7.10.7
          python -m coverage run --include="quant/universe/scoring.py,quant/quant_models.py,quant/web/track.py,quant/web/quality.py,quant/web/brief.py,quant/analytics.py" \
            -m pytest -q -p no:cacheprovider tests/test_calculations.py tests/test_research_js.py tests/test_quantum_js.py \
            tests/test_site_js.py tests/test_quant_models.py tests/test_track.py tests/test_quality.py tests/test_brief.py tests/test_analytics.py tests/test_universe.py
          python -m coverage report --fail-under=70
          npx --yes c8@10.1.3 report --temp-directory "$NODE_V8_COVERAGE" --include docs/assets/quant.js --reporter text --check-coverage --lines 95 --functions 95

      - name: Run tests
        run: python -m pytest -q -p no:cacheprovider

  secrets:
    # gitleaks over the full history, so a key committed and then deleted is still caught. The binary is
    # checked against the release's published SHA-256 before it runs. Findings are redacted in the log.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Secret scan (gitleaks 8.28.0)
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git . --redact --no-banner --exit-code 1
