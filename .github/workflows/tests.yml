# Run the whole test suite on every push to main and on every pull request (including
# Dependabot's). The tests need no data, keys or network services: the dashboard smoke tests
# skip without a local database, and the website's JavaScript is tested under Node.js.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-quantum.txt

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24"

      - name: Install dependencies
        # FinBERT (torch, transformers) is left out: the tests use the lexicon scorer, and CI
        # shouldn't download a 440 MB model on every push.
        run: |
          grep -v -E '^(torch|transformers)\b' requirements.txt > ci-requirements.txt
          python -m pip install --upgrade pip
          pip install -r ci-requirements.txt -r requirements-quantum.txt

      - name: Run tests
        run: python -m pytest -q -p no:cacheprovider
